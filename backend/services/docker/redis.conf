# Redis Configuration for Docker Environment
# This configuration addresses the vm.overcommit_memory warning

# Disable stop-writes-on-bgsave-error to prevent Redis from refusing writes
# when background save fails due to memory overcommit not being enabled.
# This is safe for non-critical data caching scenarios.
stop-writes-on-bgsave-error no

# Use RDB persistence with relaxed settings for containerized environments
# Background saves will still be attempted but won't block operations
save 900 1
save 300 10
save 60 10000

# Disable RDB checksum for slightly better performance
rdbchecksum no

# Set a reasonable timeout for client connections
timeout 0

# TCP keepalive settings
tcp-keepalive 300

# Log level - use notice for production
loglevel notice

# Disable protected mode since we're binding to 0.0.0.0 inside Docker network
protected-mode no

# Maximum memory policy is set via command line in docker-compose.yml
# maxmemory and maxmemory-policy are configured there
