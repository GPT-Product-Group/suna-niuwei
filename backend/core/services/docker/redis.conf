# Redis Configuration for Docker
# Optimized for local development with memory safety

# Connection
timeout 120
tcp-keepalive 300

# Memory Management
# Prevent Redis from refusing writes when background save fails due to low memory
stop-writes-on-bgsave-error no

# Use LRU eviction when maxmemory is reached (safe for cache/queue workloads)
maxmemory-policy allkeys-lru

# Persistence settings
# Save to disk every 60 seconds if at least 1 key changed
save 60 1

# Logging
loglevel warning

# Disable protected mode for Docker networking
protected-mode no

# Bind to all interfaces for Docker
bind 0.0.0.0
