# ============================================================================
# SUNA DOCKER COMPOSE - PRODUCTION WITH NGINX REVERSE PROXY
# ============================================================================
# This Docker Compose file runs Suna services with nginx for HTTPS support.
#
# Quick Start:
#   1. Start all services:
#      docker compose up -d
#      (nginx will auto-create a temporary self-signed certificate if needed)
#
#   2. Get Let's Encrypt certificate (first time only):
#      docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#        --email your-email@example.com -d suna.excelmaster.ai --agree-tos --no-eff-email
#      docker compose restart nginx
#
#   3. Normal operation:
#      docker compose up -d          # Start all services
#      docker compose down           # Stop all services
#      docker compose logs -f        # View all logs
#
#   4. Certificate renewal (run periodically or via cron):
#      docker compose run --rm certbot renew --quiet
#      docker compose exec nginx nginx -s reload
#
# Access:
#   - Frontend: https://suna.excelmaster.ai
#   - Backend API: https://suna.excelmaster.ai/v1
# ============================================================================

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/docker-entrypoint.sh:/custom-entrypoint.sh:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "/custom-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # This service is used for certificate operations. Run manually:
    # Get certificate:  docker compose run --rm certbot certonly --webroot -w /var/www/certbot --email your-email@example.com -d suna.excelmaster.ai --agree-tos --no-eff-email
    # Renew certificate: docker compose run --rm certbot renew
    entrypoint: "/bin/sh -c 'echo \"Certbot ready. Use docker compose run --rm certbot <command> to manage certificates.\"; trap exit TERM; while :; do sleep 1d; done'"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./backend/services/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    image: ghcr.io/suna-ai/suna-backend:latest
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped

  worker:
    image: ghcr.io/suna-ai/suna-backend:latest
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run dramatiq --skip-logging --processes 4 --threads 4 run_agent_background
    volumes:
      - ./backend/.env:/app/.env:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://suna.excelmaster.ai/v1}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-https://suna.excelmaster.ai}
        NEXT_PUBLIC_ENV_MODE: ${NEXT_PUBLIC_ENV_MODE:-production}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
